[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-hunter"
version = "1.0.0"
description = "Local-first GitHub repository triage pipeline"
requires-python = ">=3.11"

[project.scripts]
git-hunter = "git_hunter.cli:main"

[tool.setuptools.packages.find]
include = ["git_hunter*"]